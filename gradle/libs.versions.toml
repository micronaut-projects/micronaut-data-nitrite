[versions]
micronaut = "5.2.12"
micronaut-platform = "5.1.5"
micronaut-docs = "3.0.0"
micronaut-gradle-plugin = "5.0.2"
micronaut-test = "5.1.1"
micronaut-kotlin = "5.1.0"
micronaut-serde = "3.2.2"
micronaut-sql = "7.2.0"
micronaut-testresources = "4.3.0"
micronaut-validation = "5.2.0"

# Managed dependency versions
managed-micronaut-data = "5.2.5"
managed-nitrite = "5.4.2"

# Testing and benchmarking
apiguardian = "1.1.2"
jakarta-persistence-tck = "4.0.0-M6"
jmh = "1.37"

# Gradle plugins
kotlin-gradle-plugin = "2.4.20"
jmh-gradle-plugin = "0.7.3"
shadow-gradle-plugin = "9.6.1"
errorprone-gradle-plugin = "5.1.1"
nullaway = "0.14.1"
error_prone_core = "2.50.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }

# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-test = { module = "io.micronaut.test:micronaut-test-bom", version.ref = "micronaut-test" }
micronaut-kotlin = { module = "io.micronaut.kotlin:micronaut-kotlin-bom", version.ref = "micronaut-kotlin" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-sql = { module = "io.micronaut.sql:micronaut-sql-bom", version.ref = "micronaut-sql" }
micronaut-testresources = { module = "io.micronaut.testresources:micronaut-test-resources-bom", version.ref = "micronaut-testresources" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-docs = { module = "io.micronaut.docs:micronaut-docs-asciidoc-config-props", version.ref = "micronaut-docs" }
micronaut-data-document-processor = { module = "io.micronaut.data:micronaut-data-document-processor", version.ref = "managed-micronaut-data" }
micronaut-data-runtime = { module = "io.micronaut.data:micronaut-data-runtime", version.ref = "managed-micronaut-data" }
micronaut-data-document-model = { module = "io.micronaut.data:micronaut-data-document-model", version.ref = "managed-micronaut-data" }
micronaut-data-connection = { module = "io.micronaut.data:micronaut-data-connection", version.ref = "managed-micronaut-data" }
micronaut-data-tck = { module = "io.micronaut.data:micronaut-data-tck", version.ref = "managed-micronaut-data" }
micronaut-data-document-tck = { module = "io.micronaut.data:micronaut-data-document-tck", version.ref = "managed-micronaut-data" }
micronaut-jakarta-data-support-tck = { module = "io.micronaut.data:micronaut-jakarta-data-support-tck", version.ref = "managed-micronaut-data" }
jakarta-persistence-tck-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence-tck" }
apiguardian-api = { module = "org.apiguardian:apiguardian-api", version.ref = "apiguardian" }
micronaut-data-processor = { module = "io.micronaut.data:micronaut-data-processor", version.ref = "managed-micronaut-data" }

#
# Imported BOMs, also appearing in the generated BOM
#
boms-micronaut-data = { module = "io.micronaut.data:micronaut-data-bom", version.ref = "managed-micronaut-data" }
boms-nitrite = { module = "org.dizitart:nitrite-bom", version.ref = "managed-nitrite" }

nitrite = { module = "org.dizitart:nitrite" }
nitrite-mvstore-adapter = { module = "org.dizitart:nitrite-mvstore-adapter" }
nitrite-rocksdb-adapter = { module = "org.dizitart:nitrite-rocksdb-adapter" }
nitrite-spatial = { module = "org.dizitart:nitrite-spatial" }

# Benchmark
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

# PLUGINS
gradle-micronaut = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = "micronaut-gradle-plugin" }
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-gradle-plugin" }
gradle-kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin-gradle-plugin" }
gradle-jmh = { module = "me.champeau.jmh:jmh-gradle-plugin", version.ref = "jmh-gradle-plugin" }
gradle-shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow-gradle-plugin" }
gradle-errorprone = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-gradle-plugin" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error_prone_core" }
