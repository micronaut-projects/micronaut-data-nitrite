#
# This file is used to declare the list of libraries
# which are used as dependencies in the project.
# See https://docs.gradle.org/7.4.2/userguide/platforms.html#sub:central-declaration-of-dependencies
#
# For Micronaut, we have 3 kinds of dependencies:
#   - managed dependencies, which are exposed to consumers via a BOM (or version catalog)
#   - managed BOMs, which are imported into the BOM that we generate
#   - all other dependencies, which are implementation details
#
# If a library needs to appear in the BOM of the project, then it must be
# declared with the "managed-" prefix.
# If a BOM needs to be imported in the BOM of the project, then it must be
# declared with the "boms-" prefix.
# Both managed dependencies and BOMs need to have their version declared via
# a managed version (a version which alias starts with "managed-"

[versions]
micronaut = "5.1.10"
micronaut-platform = "5.0.4"
micronaut-docs = "3.0.0"
micronaut-test = "5.0.0"
micronaut-data = "5.1.1"
micronaut-kotlin = "5.0.0"
micronaut-serde = "3.1.0"
micronaut-sql = "7.1.0"
micronaut-testresources = "4.0.0"
micronaut-validation = "5.1.0"
groovy = "4.0.24"
spock = "2.3-groovy-4.0"
nitrite = "5.0.0"
jackson-datatype-jts = "2.21.0"
managed-javax-persistence = "2.2"
managed-jakarta-data = "1.1.0-M3"

# Managed versions appear in the BOM
# managed-somelib = "1.0"
# managed-somebom = "1.1"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-test = { module = "io.micronaut.test:micronaut-test-bom", version.ref = "micronaut-test" }
micronaut-data = { module = "io.micronaut.data:micronaut-data-bom", version.ref = "micronaut-data" }
micronaut-kotlin = { module = "io.micronaut.kotlin:micronaut-kotlin-bom", version.ref = "micronaut-kotlin" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-sql = { module = "io.micronaut.sql:micronaut-sql-bom", version.ref = "micronaut-sql" }
micronaut-testresources = { module = "io.micronaut.testresources:micronaut-test-resources-bom", version.ref = "micronaut-testresources" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-docs = { module = "io.micronaut.docs:micronaut-docs-asciidoc-config-props", version.ref = "micronaut-docs" }
micronaut-data-document-processor = { module = "io.micronaut.data:micronaut-data-document-processor", version.ref = "micronaut-data" }
micronaut-data-runtime = { module = "io.micronaut.data:micronaut-data-runtime", version.ref = "micronaut-data" }
micronaut-data-document-model = { module = "io.micronaut.data:micronaut-data-document-model", version.ref = "micronaut-data" }
micronaut-data-connection = { module = "io.micronaut.data:micronaut-data-connection", version.ref = "micronaut-data" }
micronaut-data-tck = { module = "io.micronaut.data:micronaut-data-tck", version.ref = "micronaut-data" }
micronaut-data-document-tck = { module = "io.micronaut.data:micronaut-data-document-tck", version.ref = "micronaut-data" }
micronaut-data-processor = { module = "io.micronaut.data:micronaut-data-processor", version.ref = "micronaut-data" }

#
# Managed dependencies appear in the BOM
#
# managed-somelib = { module = "group:artifact", version.ref = "managed-somelib" }
managed-javax-persistence-api = { module = "javax.persistence:javax.persistence-api", version.ref = "managed-javax-persistence" }
jakarta-data-api = { module = "jakarta.data:jakarta.data-api", version.ref = "managed-jakarta-data" }
managed-jakarta-data-api = { module = "jakarta.data:jakarta.data-api", version.ref = "managed-jakarta-data" }

#
# Imported BOMs, also appearing in the generated BOM
#
# boms-somebom = { module = "com.foo:somebom", version.ref = "managed-somebom" }

# Other libraries used by the project but non managed

nitrite-bom = { module = "org.dizitart:nitrite-bom", version.ref = "nitrite" }
nitrite = { module = "org.dizitart:nitrite" }
nitrite-mvstore-adapter = { module = "org.dizitart:nitrite-mvstore-adapter" }
nitrite-rocksdb-adapter = { module = "org.dizitart:nitrite-rocksdb-adapter" }
nitrite-spatial = { module = "org.dizitart:nitrite-spatial" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-datatype-jts = { module = "com.graphhopper.external:jackson-datatype-jts", version.ref = "jackson-datatype-jts" }

# micronaut-bom = { module = "io.micronaut:micronaut-bom", version.ref = "micronaut" }
# jdoctor = { module = "me.champeau.jdoctor:jdoctor-core", version.ref="jdoctor" }

[bundles]

[plugins]
