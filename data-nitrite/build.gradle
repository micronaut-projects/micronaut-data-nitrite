plugins {
    id "io.micronaut.build.internal.data-nitrite-module"
    id "groovy"
}



// Source sets for testing with optional dependencies present
sourceSets {
    // Compiled without micronaut-data-nitrite on the annotation processor path, so queries are
    // SQL-shaped rather than Nitrite JSON. Adding it back makes this a duplicate of `test`.
    generatedQueryTest {
        java.srcDir file('src/generatedQueryTest/java')
        groovy.srcDir file('src/generatedQueryTest/groovy')
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.test.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    rocksDbPresentTest {
        groovy.srcDir file('src/rocksDbPresentTest/groovy')
        resources.srcDir file('src/rocksDbPresentTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.test.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    spatialPresentTest {
        groovy.srcDir file('src/spatialPresentTest/groovy')
        resources.srcDir file('src/spatialPresentTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.test.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    // Inherits the test compile/runtime dependencies but not testAnnotationProcessor.
    generatedQueryTestImplementation {
        extendsFrom configurations.testImplementation
    }
    generatedQueryTestCompileOnly {
        extendsFrom configurations.testCompileOnly
    }
    generatedQueryTestRuntimeOnly {
        extendsFrom configurations.testRuntimeOnly, configurations.testImplementation
    }
    rocksDbPresentTestImplementation {
        extendsFrom configurations.testImplementation
    }
    rocksDbPresentTestRuntimeOnly {
        extendsFrom configurations.testRuntimeOnly, configurations.testImplementation
    }
    spatialPresentTestRuntimeOnly {
        extendsFrom configurations.testRuntimeOnly, configurations.testImplementation
    }
    spatialPresentTestCompileOnly {
        extendsFrom configurations.testCompileOnly
    }
    spatialPresentTestAnnotationProcessor {
        extendsFrom configurations.testAnnotationProcessor
    }
    spatialPresentTestImplementation {
        extendsFrom configurations.testImplementation
    }
}

dependencies {


    api projects.micronautDataNitriteCore
    api projects.micronautDataNitriteMvstore

    // Compile-only APIs remain available to the compatibility artifact's test sources.
    compileOnly mnSql.jakarta.persistence.api
    compileOnly libs.managed.jakarta.data.api
    compileOnly mn.micronaut.inject.groovy

    testAnnotationProcessor libs.micronaut.data.document.processor
    testAnnotationProcessor projects.micronautDataNitrite
    testAnnotationProcessor mn.micronaut.inject.java
    testAnnotationProcessor mnTest.micronaut.test.spock
    // Micronaut's processors use SLF4J while compiling the test source sets.
    testAnnotationProcessor mnLogging.logback.classic

    testImplementation mnSql.jakarta.persistence.api
    testImplementation libs.managed.jakarta.data.api

    testImplementation libs.micronaut.data.runtime
    testImplementation mn.micronaut.inject.groovy
    testImplementation mnTest.micronaut.test.spock
    testImplementation mnTest.micronaut.test.spock

    // Optional dependency tests - ROCKSDB adapter (only for rocksDbPresentTest source set)
    rocksDbPresentTestRuntimeOnly platform(libs.boms.nitrite)
    rocksDbPresentTestImplementation projects.micronautDataNitriteRocksdb
    // Optional dependency tests - Spatial module (only for spatialPresentTest source set)
    spatialPresentTestCompileOnly platform(libs.boms.nitrite)
    spatialPresentTestRuntimeOnly platform(libs.boms.nitrite)
    spatialPresentTestCompileOnly projects.micronautDataNitriteSpatial
    spatialPresentTestRuntimeOnly projects.micronautDataNitriteSpatial
    spatialPresentTestAnnotationProcessor projects.micronautDataNitrite

    // No micronautDataNitrite here by design - see the generatedQueryTest source set.
    generatedQueryTestAnnotationProcessor libs.micronaut.data.document.processor
    generatedQueryTestAnnotationProcessor mn.micronaut.inject.java

    testRuntimeOnly mnSerde.micronaut.serde.jackson
    testRuntimeOnly mnLogging.logback.classic
}

test {
    useJUnitPlatform()
}

// Nitrite is embedded, so no suite here resolves anything through test resources. The plugin is
// still applied for the shared build conventions, and its client throws an NPE out of
// DefaultTestResourcesClient.getRequiredPropertyEntries while loading property sources, which
// fails context startup for every spec. Disabling the client is what keeps the suites runnable.
tasks.withType(Test).configureEach {
    systemProperty "micronaut.test.resources.enabled", "false"
}

tasks.register('generatedQueryTest', Test) {
    group = "verification"
    description = "Run the generated (SQL-shaped) query fallback suite"
    useJUnitPlatform()
    testClassesDirs = sourceSets.generatedQueryTest.output.classesDirs
    classpath = sourceSets.generatedQueryTest.runtimeClasspath
    mustRunAfter test
    onlyIf { tasks.named('test').get().state.failure == null }
}

tasks.register('rocksDbPresentTest', Test) {
    group = "verification"
    useJUnitPlatform()
    testClassesDirs = sourceSets.rocksDbPresentTest.output.classesDirs
    classpath = sourceSets.rocksDbPresentTest.runtimeClasspath
    mustRunAfter test
    onlyIf { tasks.named('test').get().state.failure == null }
}

tasks.register('spatialPresentTest', Test) {
    group = "verification"
    useJUnitPlatform()
    testClassesDirs = sourceSets.spatialPresentTest.output.classesDirs
    classpath = sourceSets.spatialPresentTest.runtimeClasspath
    mustRunAfter test
    onlyIf { tasks.named('test').get().state.failure == null }
}

test.finalizedBy generatedQueryTest, rocksDbPresentTest, spatialPresentTest

tasks.named('check') {
    dependsOn tasks.named('generatedQueryTest')
    dependsOn tasks.named('rocksDbPresentTest')
    dependsOn tasks.named('spatialPresentTest')
}

micronautBuild {
    binaryCompatibility.enabledAfter("5.2.0")
}
