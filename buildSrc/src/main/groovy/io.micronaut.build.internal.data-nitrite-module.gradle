plugins {
    id 'io.micronaut.build.internal.data-nitrite-base'
    id "io.micronaut.build.internal.module"
}

dependencies {
    testRuntimeOnly mnSerde.micronaut.serde.jackson
    testRuntimeOnly mnTest.junit.platform.suite
    testRuntimeOnly mnTest.junit.platform.launcher
    testRuntimeOnly mnTest.junit.jupiter.engine
}

micronautBuild {
    binaryCompatibility.enabledAfter("5.2.0")
    descriptor {
        parentModuleId = "io.micronaut.data:micronaut-data-model"
    }
}

def testModules = rootProject.tasks.findByName("testModules")
if (testModules == null) {
    testModules = rootProject.tasks.register("testModules").get()
}
testModules.mustRunAfter(tasks.named("test"))

tasks.named("test", Test) {
    useJUnitPlatform()
}
