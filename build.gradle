plugins {
    id "io.micronaut.build.internal.parent"
    id "io.micronaut.build.internal.data-nitrite-dependencies"
}

if (System.getenv("SONAR_TOKEN") != null) {
    sonarqube {
        properties {
            property "sonar.exclusions", "**/example/**, **/data/tck/**"
            property "sonar.test.exclusions", "**/example/**, **/jakarta-data-tck/**"
        }
    }
}

project(':micronaut-data-nitrite').plugins.withId('java') {
    tasks.named('javadoc', Javadoc) {
        classpath += project(':micronaut-data-nitrite-core').sourceSets.main.compileClasspath
    }
}

tasks.named('javadoc', Javadoc) {
    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PUBLIC
    exclude '**/io/micronaut/data/info/**'
    exclude '**/example/**'
    options.addStringOption('exclude', 'io.micronaut.data.info')
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

/**
 * The aggregate report reads only each library module's `test` suite. data-nitrite's other suites,
 * the Jakarta Data TCK, the doc examples and the JVM run of native-tests exercise the same library
 * classes, so their execution data feeds the report too.
 */
plugins.withId('jacoco-report-aggregation') {
    subprojects {
        plugins.withId('java') {
            apply plugin: 'jacoco'
        }
    }
    tasks.named('testCodeCoverageReport', JacocoReport) { report ->
        subprojects.each { report.executionData(it.tasks.withType(Test)) }
    }
}
