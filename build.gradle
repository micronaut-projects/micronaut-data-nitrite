plugins {
    id "io.micronaut.build.internal.parent"
    id "io.micronaut.minimal.application" apply false
    id "org.jetbrains.kotlin.jvm" apply false
    id "org.jetbrains.kotlin.kapt" apply false
    id "org.jetbrains.kotlin.plugin.allopen" apply false
}

repositories {
    mavenLocal {
        content {
            includeGroup 'io.micronaut.data'
        }
    }
}

project(':micronaut-data-nitrite').plugins.withId('java') {
    tasks.named('javadoc', Javadoc) {
        classpath += project(':micronaut-data-nitrite').sourceSets.main.compileClasspath
    }
}

tasks.named('javadoc', Javadoc) {
    exclude '**/example/**'
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
