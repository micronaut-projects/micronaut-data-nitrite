plugins {
    id "java"
    id "io.micronaut.minimal.application"
}

application {
    mainClass = "example.Application"
}

micronaut {
    version libs.versions.micronaut.platform.get()
    runtime "netty"
    testRuntime "junit5"
}

dependencies {
    annotationProcessor libs.micronaut.data.document.processor
    annotationProcessor projects.micronautDataNitrite
    annotationProcessor mnLogging.logback.classic
    testAnnotationProcessor mnLogging.logback.classic

    implementation projects.micronautDataNitrite
    implementation(libs.nitrite.spatial) {
        exclude group: "tools.jackson.core", module: "jackson-databind"
    }
    implementation mnSql.jakarta.persistence.api

    runtimeOnly mnLogging.logback.classic

    runtimeOnly mn.snakeyaml

    testRuntimeOnly mnSerde.micronaut.serde.jackson
}
